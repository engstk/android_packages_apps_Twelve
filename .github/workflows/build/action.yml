name: build

runs:
  using: composite

  steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleRelease

    - name: Rename APK
      shell: bash
      run: |
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Twelve-CI_v1.0.${{ github.run_number }}.apk

    - name: Upload the renamed APK as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: Twelve-CI_v1.0.${{ github.run_number }}.apk
        path: app/build/outputs/apk/release/Twelve-CI_v1.0.${{ github.run_number }}.apk

    - name: Set up Git
      shell: bash
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Create Git tag
      id: tag
      shell: bash
      run: |
        VERSION="v1.0.${{ github.run_number }}"
        git tag "$VERSION"
        git push origin "$VERSION"

    - name: Create Release on GitHub (No token)
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/Twelve-CI_v1.0.${{ github.run_number }}.apk
        tag_name: "v1.0.${{ github.run_number }}"
