name: build

runs:
  using: composite

  steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleRelease

    - name: Get short Git commit hash
      shell: bash
      run: echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Rename APK
      shell: bash
      run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Twelve-CI_${{ env.commit_hash }}.apk

    - name: Upload the renamed APK as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: Twelve-CI_${{ env.commit_hash }}.apk
        path: app/build/outputs/apk/release/Twelve-CI_${{ env.commit_hash }}.apk
