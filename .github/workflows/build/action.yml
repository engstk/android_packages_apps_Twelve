name: Build and Sign APK

inputs:
  P12_BASE64:
    description: Base64 encoded .p12 keystore
    required: true
  P12_PASSWORD:
    description: Password for .p12 keystore
    required: true
  P12_ALIAS:
    description: Key alias in the .p12 keystore
    required: true

runs:
  using: composite

  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleRelease

    - name: Decode signing key
      shell: bash
      run: |
        echo "${{ inputs.P12_BASE64 }}" | base64 -d > signing_key.p12

    - name: Sign APK
      shell: bash
      run: |
        BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools -type d -name '3*' | sort -V | tail -n 1)
        "$BUILD_TOOLS/apksigner" sign \
          --ks signing_key.p12 \
          --ks-type PKCS12 \
          --ks-key-alias "${{ inputs.P12_ALIAS }}" \
          --ks-pass pass:${{ inputs.P12_PASSWORD }} \
          --key-pass pass:${{ inputs.P12_PASSWORD }} \
          --out app/build/outputs/apk/release/app-release-signed.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Rename APK
      shell: bash
      run: |
        mv app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/Twelve-CI_v1.0.${{ github.run_number }}.apk

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/Twelve-CI_v1.0.${{ github.run_number }}.apk
        tag_name: "v1.0.${{ github.run_number }}"
